<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270" role="img" aria-labelledby="title desc">
  <title id="title">AccountingCategorySelector kit illustration</title>
  <desc id="desc">An abstract accounting category grid with yellow selected tile and large icon.</desc>
  <defs>
    <radialGradient id="glow" cx="74%" cy="8%" r="70%">
      <stop offset="0" stop-color="#ffc600" stop-opacity=".34"/>
      <stop offset="1" stop-color="#ffc600" stop-opacity="0"/>
    </radialGradient>
    <filter id="selectedGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#ffc452" flood-opacity=".75"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="480" height="270" fill="#fffaf0"/>
  <rect width="480" height="270" fill="url(#glow)"/>
  <path d="M54 214c94 27 222 13 372-21" fill="none" stroke="#ffc600" stroke-width="18" stroke-linecap="round" opacity=".52"/>
  <g transform="translate(82 38)" font-family="Avenir Next, Segoe UI, sans-serif">
    <g fill="#ededed">
      <rect width="68" height="68" rx="8"/><rect x="82" width="68" height="68" rx="8"/><rect x="164" width="68" height="68" rx="8"/><rect x="246" width="68" height="68" rx="8"/>
      <rect y="82" width="68" height="68" rx="8"/><rect x="82" y="82" width="68" height="68" rx="8"/><rect x="164" y="82" width="68" height="68" rx="8"/><rect x="246" y="82" width="68" height="68" rx="8"/>
      <rect y="164" width="68" height="28" rx="8"/><rect x="82" y="164" width="68" height="28" rx="8"/><rect x="164" y="164" width="68" height="28" rx="8"/>
    </g>
    <rect width="68" height="68" rx="8" fill="#fbbd0a" filter="url(#selectedGlow)"/>
    <g font-size="12" font-weight="600">
      <text x="9" y="19" fill="#fff">餐饮</text><text x="9" y="34" fill="#fff" font-size="9" font-weight="400">Food</text>
      <text x="91" y="19" fill="#b9b9b9">水饮</text><text x="91" y="34" fill="#b9b9b9" font-size="9" font-weight="400">Drinks</text>
      <text x="173" y="19" fill="#b9b9b9">水果</text><text x="173" y="34" fill="#b9b9b9" font-size="9" font-weight="400">Fruit</text>
      <text x="255" y="19" fill="#b9b9b9">购物</text><text x="255" y="34" fill="#b9b9b9" font-size="9" font-weight="400">Shop</text>
    </g>
    <g font-family="Apple Color Emoji, Segoe UI Emoji, sans-serif" font-size="48" opacity=".62">
      <text x="35" y="63" text-anchor="middle" transform="rotate(23 35 52)" opacity="1">🍔</text>
      <text x="126" y="68" text-anchor="middle">🥤</text><text x="208" y="68" text-anchor="middle">🍎</text><text x="290" y="68" text-anchor="middle">🛒</text>
      <text x="44" y="150" text-anchor="middle">🚌</text><text x="126" y="150" text-anchor="middle">🏨</text><text x="208" y="150" text-anchor="middle">🎮</text><text x="290" y="150" text-anchor="middle">📦</text>
